# Nightly data refresh: download the sources that change (FEC, Wikipedia), rebuild and validate
# data/clean, then publish. Routine changes are committed to main (Vercel redeploys); unusual
# ones (see pipeline/diff_guard.py) go to a pull request for a person to check first.
name: Nightly data refresh

on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC, 6:17 AM Eastern: after the FEC's overnight bulk files
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-data
  cancel-in-progress: false

env:
  REVIEW_BRANCH: data-refresh-review

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so the publish step can rebase onto a newer main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/constraints.txt

      - name: Install the pipeline
        run: pip install -r pipeline/requirements.txt -c pipeline/constraints.txt

      # Sources that never change are downloaded once and kept in the Actions cache.
      - name: Restore static sources
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            data/raw/hexmap
            data/raw/downballot
          key: raw-static-v1

      - name: Test the publish gate
        run: python -m unittest discover -s pipeline -p "test_*.py"

      - name: Build and validate data
        run: python pipeline/run.py --refresh fec,wikipedia

      - name: Decide what to publish
        id: guard
        run: |
          set +e
          python pipeline/diff_guard.py --summary "$RUNNER_TEMP/summary.md"
          code=$?
          set -e
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "result=none" >> "$GITHUB_OUTPUT" ;;
            10) echo "result=routine" >> "$GITHUB_OUTPUT" ;;
            20) echo "result=review" >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.result != 'none'
        with:
          node-version: 22
          cache: npm

      - name: Check the site builds with the new data
        if: steps.guard.outputs.result != 'none'
        run: |
          npm ci
          npm test
          npm run build

      - name: Publish to main
        if: steps.guard.outputs.result == 'routine'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/clean
          git commit -m "Nightly data refresh $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open a pull request for review
        if: steps.guard.outputs.result == 'review'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$REVIEW_BRANCH"
          git add data/clean
          git commit -m "Data refresh $(date -u +%F): needs review"
          git push --force origin "$REVIEW_BRANCH"
          title="Data refresh needs review ($(date -u +%F))"
          if gh pr view "$REVIEW_BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$REVIEW_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --base main --head "$REVIEW_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md" || {
              echo "::error::Could not open the pull request. Enable 'Allow GitHub Actions to create and approve pull requests' (Settings > Actions > General), or open one from the $REVIEW_BRANCH branch."
              exit 1
            }
          fi

      # Optional sources (polling, Senate seats, 2024 lines, money) fail softly in the pipeline.
      # Fail the run here so the owner is emailed, after everything else was published.
      - name: Report pipeline warnings
        run: |
          python - <<'PY'
          import json, sys
          warnings = json.load(open("data/clean/meta.json", encoding="utf-8")).get("warnings") or []
          for w in warnings:
              print(f"::warning::{w}")
          sys.exit(1 if warnings else 0)
          PY
